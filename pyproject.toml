[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelatlasify"
version = "0.1.0"
description = "Turn numerical model output into discoverable, geospatially standardized assets (GeoTIFF, maps, STAC)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "xarray",
    "netcdf4",
    "pyproj",
    "rasterio",
    "shapely",
    "matplotlib",
    "cartopy",
    "pystac",
]

[project.optional-dependencies]
validation = ["jsonschema"]

[project.scripts]
modelatlasify = "modelatlasify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelatlasify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs internet access (fetches STAC extension schemas)",
]

# ---------------------------------------------------------------------------
# Pixi environment (https://pixi.sh). Scientific/geospatial stack from conda-forge
# so GDAL/PROJ/GEOS binaries are consistent.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.26"
xarray = ">=2024.1"
netcdf4 = ">=1.6"
pyproj = ">=3.6"
rasterio = ">=1.3"
shapely = ">=2.0"
matplotlib-base = ">=3.8"
cartopy = ">=0.23"
pystac = ">=1.10"
jsonschema = ">=4.0"

[tool.pixi.pypi-dependencies]
modelatlasify = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8"
gdal = ">=3.6"  # provides gdalinfo for checking GeoTIFFs like a GIS tool would

[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
